; Hosyond 3.2" ESP32-32E  (ESP32-D0WD-V3, 4MB flash, ST7789 240x320, XPT2046 touch)
[env:cyd32]
platform = espressif32
board = esp32dev
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA on 4 MB flash
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.*usbserial*
monitor_port = /dev/cu.*usbserial*
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.3.0
    ricmoo/QRCode @ ^0.0.1
build_flags =
    -D PIXEL_FW_VERSION=\"0.5.0\"
    -D PIXEL_DEVICE_TYPE=\"lite\"
    ; brain the device connects to until the owner changes it in setup (dev: this laptop)
    -D PIXEL_DEFAULT_BRAIN_HOST=\"pixel.priteshbhavsar.com\"
    -D PIXEL_DEFAULT_BRAIN_PORT=443
    -D PIXEL_DEFAULT_BRAIN_TLS=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
