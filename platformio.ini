; Two boards, one firmware. Shared flags live in [common]; each env adds its board HAL selector (PIXEL_BOARD_*).
[common]
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.3.0
    ricmoo/QRCode @ ^0.0.1
build_flags =
    -D PIXEL_FW_VERSION=\"0.6.3\"
    ; brain the device connects to until the owner changes it in setup
    -D PIXEL_DEFAULT_BRAIN_HOST=\"pixel.priteshbhavsar.com\"
    -D PIXEL_DEFAULT_BRAIN_PORT=443
    -D PIXEL_DEFAULT_BRAIN_TLS=1
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Waveshare ESP32-S3-Touch-LCD-3.5B  (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, AXS15231B QSPI 320x480 + cap touch,
; ES8311 codec + mic, AXP2101 PMIC, QMI8658 IMU, OV2640 camera). Pixel-3S.
[env:pixel3s]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv     ; two 6.25 MB app slots for OTA + 3.4 MB spiffs
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
lib_deps =
    ${common.lib_deps}
    https://github.com/moononournation/Arduino_GFX.git#v1.6.0
    lewisxhe/XPowersLib @ ^0.3.3
build_flags =
    ${common.build_flags}
    -D PIXEL_BOARD_3S=1
    -D PIXEL_DEVICE_TYPE=\"3s\"
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; TFT_eSPI is used only as a sprite renderer here (framebuffer in PSRAM, pushed via Arduino_GFX); these pins are never driven
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MOSI=10
    -D TFT_SCLK=11
    -D TFT_CS=-1
    -D TFT_DC=-1
    -D TFT_RST=-1
    -D SPI_FREQUENCY=20000000

; Hosyond 3.2" ESP32-32E  (ESP32-D0WD-V3, 4MB flash, ST7789 240x320, XPT2046 touch). Pixel-Lite.
[env:cyd32]
platform = espressif32
board = esp32dev
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA on 4 MB flash
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.*usbserial*
monitor_port = /dev/cu.*usbserial*
upload_speed = 460800
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D PIXEL_BOARD_LITE=1
    -D PIXEL_DEVICE_TYPE=\"lite\"
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000
