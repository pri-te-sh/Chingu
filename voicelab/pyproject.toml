[project]
name = "voicelab"
version = "0.1.0"
description = "Pixel voice lab: side-by-side STT / TTS / VAD / turn-taking test bed (runs natively on the Mac)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12", "numpy>=1.26", "httpx>=0.27", "python-multipart>=0.0.9", "soundfile>=0.12",
    "faster-whisper>=1.2",          # CPU int8 whisper (current production engine)
    "onnx-asr>=0.12",               # NVIDIA Parakeet-TDT 0.6B v2 (top of the open ASR leaderboard, CPU-friendly)
    "piper-tts>=1.8",               # current production TTS
    "kokoro-onnx>=0.6",             # Kokoro-82M, natural voices, real-time on CPU
    "supertonic>=1.3",              # Supertonic 3, 99M onnx, built for CPU
    "silero-vad>=6.0",              # neural VAD to compare against the energy VAD
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
chatterbox = ["chatterbox-tts>=0.1.7"]

[tool.uv]
package = false
