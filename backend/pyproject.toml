[project]
name = "pixel-brain"
version = "0.2.0"
description = "Pixel platform brain: device WebSocket protocol, memory, tools, portal; STT/TTS worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "numpy>=1.26",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
laptop = ["sounddevice>=0.5"]
modal = ["modal>=1.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
