[project]
name = "pixel-brain"
version = "0.1.0"
description = "Pixel (Tiny AI Companion) backend: streaming STT -> LLM -> TTS over WebSocket"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "numpy>=1.26",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
laptop = ["sounddevice>=0.5"]
modal = ["modal>=1.0"]
